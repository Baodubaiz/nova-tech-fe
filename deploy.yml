name: Deploy NovaTech Frontend to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Bước 1: Đăng nhập Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Bước 2: Build Docker Image và truyền Variables vào làm Build-Args
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nova-tech-fe:latest
          # [THÊM ĐOẠN NÀY] Bốc config từ GitHub Variables truyền vào Docker
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_APP_NAME=${{ vars.NEXT_PUBLIC_APP_NAME }}

      # Bước 3: SSH vào AWS EC2 thực thi chạy container
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker stop nova-tech-fe-container || true
            docker rm nova-tech-fe-container || true
            docker image prune -f || true
            
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/nova-tech-fe:latest
            
            docker run -d \
              --name nova-tech-fe-container \
              -p 3000:3000 \
              --restart always \
              ${{ secrets.DOCKERHUB_USERNAME }}/nova-tech-fe:latest
              
            sudo systemctl reload nginx || true